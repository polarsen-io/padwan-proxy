[project]

site_name = "Padwan Proxy"
site_description = "Anthropic Messages API on top of any OpenAI-compatible backend"
site_url = "https://polarsen-io.github.io/padwan-proxy"

repo_url = "https://github.com/polarsen-io/padwan-proxy"
repo_name = "polarsen-io/padwan-proxy"
edit_uri = "edit/master/docs/"

extra_css = ["stylesheets/extra.css"]

nav = [
  { "Introduction" = "index.md" },
  { "Claude Code" = "claude-code.md" },
  { "Routing" = "routing.md" },
  { "Options" = "options.md" },
  { "Docker" = "docker.md" },
  { "Tracing" = "tracing.md" },
  { "Tool approvals" = [
    { "Approval hook" = "approvals.md" },
    { "Local Laya model" = "laya.md" },
  ] },
  { "Development" = "development.md" },
]

[project.theme]

logo = "static/logo-hood.png"
favicon = "static/favicon.png"

features = [
  "navigation.sections",
  "navigation.top",
  "navigation.expand",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "content.action.edit",
  "toc.integrate",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.tables]
