name: Docker

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      version:
        description: Release version to tag the image with
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build image
    runs-on: ubuntu-latest
    env:
      # release.yml is itself triggered by a pull_request event, so event_name
      # is not enough to tell a release apart from a PR — the version input is.
      VERSION: ${{ inputs.version || '' }}
      PUBLISH: ${{ (inputs.version || '') != '' || github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=edge,enable=${{ env.VERSION == '' }}
            type=raw,value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=raw,value=latest,enable=${{ env.VERSION != '' }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
