name: Docker

on:
  pull_request:
  push:
    branches: [master]
    # release tags, pushed by release.yml
    tags: ["*"]
  # run on a tag to re-publish its images
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build image
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          bake-target: meta-slim
          tags: |
            type=raw,value=edge,enable=${{ env.VERSION == '' }}
            type=raw,value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=raw,value=latest,enable=${{ env.VERSION != '' }}

      - name: Laya image metadata
        id: meta-laya
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          bake-target: meta-laya
          tags: |
            type=raw,value=${{ env.VERSION }}-laya,enable=${{ env.VERSION != '' }}
            type=raw,value=laya,enable=${{ env.VERSION != '' }}

      - name: Build and push
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
            cwd://${{ steps.meta-laya.outputs.bake-file }}
          # laya (multi-GB) only on releases
          targets: ${{ env.VERSION != '' && 'default' || 'slim' }}
          push: ${{ env.PUBLISH == 'true' }}
          set: |
            slim.cache-from=type=gha,scope=slim
            slim.cache-to=type=gha,scope=slim,mode=max
            laya.cache-from=type=gha,scope=laya
            laya.cache-to=type=gha,scope=laya,mode=max
