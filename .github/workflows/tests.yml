name: Tests

# Shared by ci.yml (per push/PR) and nightly.yml (forward-compat check).
on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string

jobs:
  tests:
    name: Tests (Python ${{ inputs.python-version }})
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check padwan_proxy/ tests/

      - name: Check format
        run: uv run ruff format --check padwan_proxy/ tests/

      - name: Type check
        run: uv run pyright padwan_proxy/
        env:
          PYRIGHT_PYTHON_GLOBAL_NODE: true

      - name: Run tests
        run: uv run pytest -vv --cov=padwan_proxy --cov-report=term-missing
