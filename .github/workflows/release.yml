name: Release

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to re-publish (e.g. 0.11.0)
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || 'master' }}
          fetch-depth: 0
          # a PAT-pushed tag triggers docker.yml; GITHUB_TOKEN's would not
          token: ${{ secrets.POLARSEN_BOT_PAT }}

      - name: Extract version from branch name
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${HEAD_REF#release/}}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$HEAD_REF" ]; then
            echo "error: could not extract version from $HEAD_REF" >&2
            exit 1
          fi
          PKG_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "error: branch version $VERSION != pyproject version $PKG_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build package
        run: uv build

      - name: Save PR body as release notes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ secrets.POLARSEN_BOT_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # On dispatch, reuse the notes of the existing GitHub Release
          if [ -z "$PR_BODY" ]; then PR_BODY=$(gh release view "$VERSION" --json body --jq .body); fi
          printf '%s\n' "$PR_BODY" > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "error: PR body is empty — refusing to release" >&2
            exit 1
          fi

      - name: Tag release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Idempotent so a partially failed run can be re-dispatched
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "tag $VERSION already exists, skipping"; exit 0
          fi
          git config user.name "Polarsen bot"
          git config user.email "bot@polarsen.io"
          git tag -a "$VERSION" -F RELEASE_NOTES.md
          git push origin "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          token: ${{ secrets.POLARSEN_BOT_PAT }}

      - name: Publish to PyPI
        run: uv publish

