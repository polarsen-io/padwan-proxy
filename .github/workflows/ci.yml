name: CI

on:
  push:
    branches:
      - master
    tags-ignore:
      - '**'
  pull_request:

jobs:
  # 3.15 runs in nightly.yml until it ships — building its wheels from source
  # costs ~15min per run, too slow to gate every PR on.
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      python-version: "3.14"
