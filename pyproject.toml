[project]
name = "padwan-proxy"
version = "0.1.0"
description = "Serve the Anthropic Messages API over any OpenAI-compatible backend, so Anthropic clients (e.g. Claude Code) can use it"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { email = "julien.brayere@polarsen.io" }
]
requires-python = ">=3.13"
dependencies = [
    "padwan-ai>=0.14.1",
    "piou>=0.37.0",
    "gravier>=0.1.0",
    "orjson>=3.12",
    "msgspec>=0.19",
    # --claude-config renders the client settings.json
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
# `--trace` observability: Langfuse or OTLP export.
trace = [
    "padwan-ai[langfuse]>=0.14.1",
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp>=1.44",
]
# `--laya` local tool approvals: a Laya checkpoint instead of the TypeSafe API.
laya = [
    "laya>=0.3.3",
]

[project.scripts]
padwan-proxy = "padwan_proxy:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    # fake OpenAI backend in tests
    "starlette>=1.6",
    "uvicorn>=0.53",
    # http client for ASGIBridge tests
    "niquests>=3.21.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    # keep the trace extra type-checkable/testable in dev
    "padwan-ai[langfuse]>=0.14.1",
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp>=1.44",
]
bump = [
    "commitizen>=4.18.1",
]
docs = [
    "zensical>=0.0.67",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
update_changelog_on_bump = true

[tool.pytest.ini_options]
addopts = "-m 'not e2e'"
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests requiring a real reasoning backend",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
combine-as-imports = true
